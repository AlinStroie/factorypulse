[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse"
version = "0.1.0"
description = "Platforma de date industriale: ingestie, calitate, detectie de anomalii, agent RCA."
requires-python = ">=3.12"
dependencies = ["asyncua>=1.1", "paho-mqtt>=2.0", "psycopg[binary]>=3.2", "pyarrow>=17", "pydantic>=2.9"]

[project.optional-dependencies]
# pandas e doar pentru teste pana la FP-205 (silver), cand devine dependinta de rulare
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas>=2.2", "pandas-stubs>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["factorypulse"]
# sysmon (Python 3.12+) e mult mai rapid decat settrace: pornirea asyncua scade de la ~30 s la ~2 s
core = "sysmon"

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[[tool.mypy.overrides]]
module = ["asyncua", "asyncua.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
