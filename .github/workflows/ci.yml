name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instaleaza dependintele de dezvoltare
        run: python -m pip install -e ".[dev]"

      - name: Verificari (lint, format, tipuri, teste)
        run: make check
