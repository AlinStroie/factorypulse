[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse"
version = "0.1.0"
description = "Platforma de date industriale: ingestie, calitate, detectie de anomalii, agent RCA."
requires-python = ">=3.12"
dependencies = ["asyncua>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[[tool.mypy.overrides]]
module = ["asyncua", "asyncua.*"]
ignore_missing_imports = true
